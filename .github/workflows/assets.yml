name: Assets

on:
  push:
    branches:
      - main
      - "v*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      elixir: "1.20.5"
      otp: "29.1.2"
    permissions:
      contents: write # for stefanzweifel/git-auto-commit-action to push code in repo
    steps:
      # the push step below needs the checkout credentials
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.elixir }}
          otp-version: ${{ env.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.otp }}-${{ env.elixir }}-dev-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.otp }}-${{ env.elixir }}-dev-
      - name: Install dependencies
        run: mix deps.get --only dev

      - name: Set up Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: mix assets.build

      - name: Push updated assets
        id: push_assets
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Update assets
          file_pattern: priv/static
