name: CI
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mix_test:
    name: mix test (Elixir ${{matrix.elixir}} | OTP ${{matrix.otp}})

    env:
      MIX_ENV: test
      PHX_CI: true

    strategy:
      matrix:
        include:
          - elixir: "1.15.8"
            otp: "25.3.2.21"

          - elixir: "1.18.4"
            otp: "27.3.4.13"

          - elixir: "1.20.4"
            otp: "29.0.5"
            lint: true

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Install dependencies
        run: mix deps.get --only test

      - name: Remove compiled application files
        run: mix clean

      - name: Compile & lint dependencies
        run: mix compile --warnings-as-errors
        if: ${{ matrix.lint }}

      - name: Run tests
        run: mix test
        if: ${{ !matrix.lint }}

      - name: Run tests & lint
        run: mix test --warnings-as-errors
        if: ${{ matrix.lint }}

  installer_test:
    name: installer test (Elixir ${{matrix.elixir}} | OTP ${{matrix.otp}})

    env:
      MIX_ENV: test
      PHX_CI: true

    strategy:
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3.4.3"

          - elixir: "1.20.4"
            otp: "29.0.5"

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Install installer dependencies
        run: mix deps.get
        working-directory: installer

      - name: Run installer unit tests
        run: mix test
        working-directory: installer

      - name: Install root dependencies
        run: mix deps.get --only test

      - name: Run mix_phx_new generator integration tests
        run: mix test --only mix_phx_new

  npm_test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-npm-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-npm

      - name: Set up Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install locked npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docs:
    name: mix docs

    env:
      MIX_ENV: docs

    strategy:
      matrix:
        include:
          - elixir: "1.20.4"
            otp: "29.0.5"

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # the docs alias also builds the JavaScript documentation with npm
      - name: Set up Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: docs-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            docs-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: mix deps.get --only docs

      - name: Build the documentation
        run: mix docs --warnings-as-errors

  integration-test-elixir:
    name: integration test [${{ matrix.service == 'none' && 'sqlite3 + no-db' || matrix.service }}] (Elixir ${{ matrix.versions.elixir }} | OTP ${{ matrix.versions.otp }})

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        service: [postgresql, mysql, mssql, none]
        versions:
          - elixir: "1.18.4"
            otp: "27.3.4.3"

          - elixir: "1.20.4"
            otp: "29.0.5"

    env:
      ELIXIR_ASSERT_TIMEOUT: 10000
      PHX_CI: true
      # Set to half of the runner vCPU cores to compile deps/NIFs
      # concurrently across OS processes without CPU oversubscription.
      # See https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
      # and https://elixir-lang.org/blog/2025/10/16/elixir-v1-19-0-released/
      MIX_OS_DEPS_COMPILE_PARTITION_COUNT: 2
      MAKEFLAGS: "-j2"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mount installer/tmp on tmpfs
        run: |
          mkdir -p installer/tmp
          sudo mount -t tmpfs -o size=4G,uid=$(id -u),gid=$(id -g) tmpfs installer/tmp

      - name: Start database container (${{ matrix.service }})
        if: matrix.service != 'none'
        run: |
          docker compose -f integration_test/docker-compose.yml up -d --wait ${{ matrix.service }}

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.versions.elixir }}
          otp-version: ${{ matrix.versions.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            integration_test/deps
            integration_test/_build
          key: integration-deps-${{ runner.os }}-${{ matrix.versions.otp }}-${{ matrix.versions.elixir }}-${{ hashFiles('integration_test/mix.lock') }}
          restore-keys: |
            integration-deps-${{ runner.os }}-${{ matrix.versions.otp }}-${{ matrix.versions.elixir }}

      - name: Fetch dependencies
        working-directory: integration_test
        run: mix deps.get

      - name: Compile dependencies
        working-directory: integration_test
        run: mix deps.compile
        env:
          MIX_ENV: test

      - name: Run integration tests
        working-directory: integration_test
        run: |
          if [ "${{ matrix.service }}" = "none" ]; then
            FLAGS="--include database:sqlite3"
          else
            FLAGS="--include database:${{ matrix.service }} --only database:${{ matrix.service }}"
          fi

          mix test $FLAGS \
            --formatter ExUnit.CLIFormatter \
            --formatter Phoenix.Integration.SummaryFormatter
